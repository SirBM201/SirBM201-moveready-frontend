name: Frontend Production Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: https://example.invalid
      NEXT_PUBLIC_MOVERREADY_API_BASE_URL: https://example.invalid
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # NODE_ENV=production is required for the build, but npm would otherwise
        # omit declared build-time devDependencies such as @tailwindcss/postcss.
        run: npm ci --include=dev

      - name: Test B06 general-user Jobs contract
        run: npm run test:b06

      - name: Test B08 Language Coach contract
        run: npm run test:b08

      - name: Test B10 Financial Readiness contract
        run: npm run test:b10

      - name: Test B11 Opportunity / Route Finder contract
        run: npm run test:b11

      - name: Test B12 Documents, Evidence and Applications contract
        run: npm run test:b12

      - name: Build Next.js application
        run: npm run build
