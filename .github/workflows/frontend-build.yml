name: Frontend Production Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "docs/LQ**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "docs/LQ**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_BACKEND_URL: https://example.invalid
      MOVEREADY_BACKEND_URL: https://example.invalid
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Test LQ02 integration foundation
        run: npm run test:lq02
      - name: Test LQ03 vacancy discovery and detail journey
        run: npm run test:lq03
      - name: Test LQ04 guided onboarding and product shell
        run: npm run test:lq04
      - name: Test LQ05 Career Studio
        run: npm run test:lq05
      - name: Test LQ06 Vacancy Alignment Report
        run: npm run test:lq06
      - name: Test LQ07 application execution and portfolio
        run: npm run test:lq07
      - name: Test LQ08 campaign employer recruiter intelligence
        run: npm run test:lq08
      - name: Test LQ09 browser capture and safe assistant
        run: npm run test:lq09
      - name: Test LQ10 LinkedIn optimizer and mock interview
        run: npm run test:lq10
      - name: Build Chrome extension package
        run: npm run build:extension
      - name: Test deployed-journey harness configuration
        run: npm run test:e2e
      - name: Test B06 general-user Jobs contract
        run: npm run test:b06
      - name: Test B08 Language Coach contract
        run: npm run test:b08
      - name: Test B10 Financial Readiness contract
        run: npm run test:b10
      - name: Test B11 Opportunity / Route Finder contract
        run: npm run test:b11
      - name: Test B12 Documents, Evidence and Applications contract
        run: npm run test:b12
      - name: Test B13 Dashboard Orchestration contract
        run: npm run test:b13
      - name: Test B14 Smart Alerts contract
        run: npm run test:b14
      - name: Test B15 Mobile and Accessibility contract
        run: npm run test:b15
      - name: Test B16 Deployment and Operations contract
        run: npm run test:b16
      - name: Build Next.js application
        run: npm run build
